# One-off: run the complete suite on a Mac (UTC, like Codemagic) to read why
# the 1.0.5 (53) and (54) candidates failed Codemagic's test step. Lives only
# on the claude/mac-test-probe branch.
name: mac-test-probe
on:
  push:
    branches: [claude/mac-test-probe]
jobs:
  suite:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
      - run: flutter pub get
      - name: Complete suite
        shell: bash
        run: |
          set +e
          flutter test --no-pub > test.log 2>&1
          echo "SUITE_EXIT=$?" >> "$GITHUB_ENV"
          tail -3 test.log
      - name: Report failures as annotations
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          log = open('test.log', encoding='utf-8', errors='replace').read().splitlines()
          failed = sorted({re.sub(r'^.*?/test/', 'test/', l) for l in log if l.rstrip().endswith('[E]')})
          print('FAILED', len(failed))
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=failed tests::' + esc('\n'.join(failed) or 'none'))
          # The first lines of each failure's report.
          blocks, cur = [], None
          for l in log:
              if 'EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK' in l or l.startswith('Error:'):
                  cur = [l]; blocks.append(cur)
              elif cur is not None and len(cur) < 18:
                  cur.append(l)
          for i, b in enumerate(blocks[:9]):
              print('::error title=failure %d::' % (i + 1) + esc('\n'.join(b))[:60000])
          PY
          tail -1 test.log
          test "${SUITE_EXIT:-1}" = "0"
