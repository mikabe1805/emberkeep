<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Turn everyday actions into quests, XP, and a build that changes with you.">
  <link rel="canonical" href="https://roomofdays.com/">

  <!-- Static link previews for room invites. The query code remains in the
       shared URL while crawlers receive one consistent, privacy-safe card. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Room of Days">
  <meta property="og:title" content="Room of Days">
  <meta property="og:description" content="Come visit a small room built from the days someone is keeping.">
  <meta property="og:url" content="https://roomofdays.com/">
  <meta property="og:image" content="https://roomofdays.com/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Room of Days lit-window mark">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Room of Days">
  <meta name="twitter:description" content="Come visit a small room built from the days someone is keeping.">
  <meta name="twitter:image" content="https://roomofdays.com/icons/Icon-512.png">
  <meta name="twitter:image:alt" content="Room of Days lit-window mark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#191210">

  <!-- iOS PWA: installed from Safari via Share → Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Room of Days">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Room of Days</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* candlelit from the very first frame — no white flash */
    html, body { background: #191210; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
