name: emberkeep
description: "Room of Days — real quests, real progress, kept in a room that grows with you."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.3+21

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # 6.8.1's Built-in Kotlin path does not expose AudioplayersPlugin to the
  # generated Android registrant under this AGP 9 release setup.
  audioplayers: 6.7.1
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.5
  web: ^1.1.1
  # 13.3.0's Built-in Kotlin path does not compile with this AGP 9 release
  # setup (SharePlusPendingIntent is unresolved). Keep the last verified build.
  share_plus: 13.1.0
  url_launcher: ^6.3.2
  # Local notifications are NATIVE-only (no web support); all calls are behind
  # a conditional import (platform/notifications_stub.dart on web) so the web
  # build never compiles the plugin. timezone + flutter_timezone power the
  # zoned daily/event scheduling.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  sensors_plus: ^7.1.0
  cloud_functions: ^6.3.6
  firebase_app_check: ^0.4.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Release verification reads APK ZIP entries and hashes immutable candidates.
  archive: 4.0.9
  crypto: 3.0.7
  # Losslessly exports opaque, store-compliant RGB screenshots from Flutter's
  # RGBA golden captures; see tool/export_store_screenshots.dart.
  image: 4.8.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App launcher icons — the owner-approved Room of Days Day Ledger, exported by
# `tool/export_app_icons.dart` and `flutter_launcher_icons`. The legacy package
# and bundle identifiers intentionally remain unchanged.
flutter_launcher_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  background_color_ios: "#191210"
  image_path: "web/icons/Icon-1024.png"
  adaptive_icon_background: "#170D0A"
  adaptive_icon_foreground: "assets/brand/room-of-days-adaptive-foreground-v1.png"
  adaptive_icon_monochrome: "assets/brand/room-of-days-monochrome-v2.png"
  adaptive_icon_foreground_inset: 8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  config:
    # Flutter 3.44+ uses SwiftPM first and falls back to CocoaPods only for
    # plugins that have not migrated yet. Keep that choice project-scoped so a
    # CI machine's global Flutter settings cannot silently change iOS linkage.
    enable-swift-package-manager: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/sfx/
    - assets/google_fonts/
    - assets/room/
    # painted room plates, one per wall style (see ROOM-PLATES.md). Optional:
    # a style with no plate falls through to the procedural painter.
    - assets/rooms/
    - assets/rooms/previews/
    - assets/routine/
    - assets/brand/
    - assets/quest/
    - assets/pages/
    # (round-62) the character + stage scenes are now fully code-painted
    # (widgets/portrait.dart, widgets/stage_scene.dart) — the old AI-generated
    # mascot PNGs and backdrop webps are retired, cutting ~30MB from the bundle.

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/google_fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Fraunces-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/google_fonts/Fraunces-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/google_fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: EBGaramond
      fonts:
        - asset: assets/google_fonts/EBGaramond-Variable.ttf
        - asset: assets/google_fonts/EBGaramond-Italic-Variable.ttf
          style: italic

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
