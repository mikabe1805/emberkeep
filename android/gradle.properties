# Keep release builds inside a predictable memory envelope. The template's
# 8G heap + 4G metaspace reservation exhausted native memory on the 32G release
# machine once Gradle and plugin workers were active, crashing the daemon.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=4
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
